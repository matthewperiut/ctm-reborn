modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/matthewperiut/ctm-reborn/issues"

[[mods]]
    modId = "ctm_reborn"
    version = "${version}"
    displayName = "CTM Reborn"
    displayURL = "https://github.com/matthewperiut/ctm-reborn"
    logoFile = "icon.png"
    authors = "ThatGravyBoat"
    credits = "Fork of Athena by ThatGravyBoat / Terrarium Earth, used under the MIT license. Maintained for Chisel Reborn until Athena updates, at which point this is deprecated."
    description = "Crossplatform Baked Model Loader. A fork of Athena, kept current so connected textures keep working."

[[mixins]]
    config = "athena.mixins.json"
[[mixins]]
    config = "athena-neoforge.mixins.json"

[[dependencies.ctm_reborn]]
    modId = "neoforge"
    type="required"
    versionRange = "[26.3,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.ctm_reborn]]
    modId = "minecraft"
    type="required"
    versionRange = "[26.3,)"
    ordering = "NONE"
    side = "BOTH"
