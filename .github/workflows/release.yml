name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Attaching the jars to the GitHub release needs write access; the default token is read only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Read versions
        id: versions
        run: |
          version="$(grep -m1 -E '^version *=' gradle.properties | cut -d= -f2- | tr -d ' ')"
          minecraft="$(grep -m1 -E '^minecraft *=' gradle/libs.versions.toml | cut -d= -f2- | tr -d ' "')"

          # The Minecraft line this build targets, e.g. 26.3 from 26.3-snapshot-9.
          line="${minecraft%%-*}"
          next="$(echo "${line}" | awk -F. '{ $2 = $2 + 1; print $1 "." $2 }')"

          case "${minecraft}" in
            *-*)
              # Built against a pre-release. Mojang has not shipped ${line} yet, so it does not exist
              # as a game version on either platform and cannot be listed on its own. Advertise from
              # this build up to the next line instead, which covers the rest of the line now and
              # picks up ${line} itself as soon as it exists.
              game_versions=">=${minecraft} <${next}"
              ;;
            *)
              game_versions="${minecraft}"
              ;;
          esac

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "minecraft=${minecraft}" >> "${GITHUB_OUTPUT}"
          echo "line=${line}" >> "${GITHUB_OUTPUT}"
          echo "game-versions=${game_versions}" >> "${GITHUB_OUTPUT}"

          echo "Publishing ${version} for Minecraft ${minecraft}"

      - name: Check which platforms were built
        id: platforms
        run: |
          # The neoforge module is dropped from the build on Minecraft versions NeoForge has not
          # shipped for, so its jar may legitimately not exist. Skip that upload instead of failing.
          if compgen -G "neoforge/build/libs/*.jar" > /dev/null; then
            echo "neoforge=true" >> "${GITHUB_OUTPUT}"
          else
            echo "neoforge=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::No NeoForge jar was built, skipping the NeoForge upload."
          fi

      - name: Publish Fabric
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: "[Fabric] CTM Reborn ${{ steps.versions.outputs.version }} for ${{ steps.versions.outputs.line }}"
          version: "fabric-${{ steps.versions.outputs.line }}-${{ steps.versions.outputs.version }}"
          version-type: release

          files: fabric/build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: fabric
          dependencies: fabric-api(required)

          # The default filter is "releases", which silently drops snapshots and would leave a
          # snapshot build with no game version at all, so no filtering is applied.
          game-versions: ${{ steps.versions.outputs.game-versions }}
          game-version-filter: none

          changelog-file: changelog.md

      - name: Publish NeoForge
        if: ${{ !cancelled() && steps.platforms.outputs.neoforge == 'true' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          name: "[NeoForge] CTM Reborn ${{ steps.versions.outputs.version }} for ${{ steps.versions.outputs.line }}"
          version: "neoforge-${{ steps.versions.outputs.line }}-${{ steps.versions.outputs.version }}"
          version-type: release

          files: neoforge/build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: neoforge

          game-versions: ${{ steps.versions.outputs.game-versions }}
          game-version-filter: none

          changelog-file: changelog.md
